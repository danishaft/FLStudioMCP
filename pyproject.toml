[project]
name = "fl-studio-mcp"
version = "0.2.0"
description = "Comprehensive Model Context Protocol server for FL Studio — full control over transport, patterns, channels, mixer, plugins, piano roll, playlist, arrangement, automation and rendering, plus voice-to-MIDI and audio-file analysis."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "fLMCP" }]
keywords = ["fl-studio", "mcp", "model-context-protocol", "midi", "daw", "music", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "anyio>=4.0",
    "pydantic>=2.0",
]

# Heavy, optional dependencies. The core MCP server (transport, mixer, channels,
# plugins, patterns, piano roll, generators) runs WITHOUT any of these — they are
# imported lazily, only when a voice-to-MIDI or audio-analysis tool is actually
# called. Install with:  pip install "fl-studio-mcp[audio]"
[project.optional-dependencies]
audio = [
    "numpy>=1.23",
    "scipy>=1.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
]
gui = [
    "dearpygui>=1.9",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.23",
    # Offline FL Studio API stubs — let the test suite import the FL-side bridge
    # and exercise its handlers (catches signature/arity mistakes) without FL.
    "fl-studio-api-stubs>=37",
]

[project.urls]
Homepage = "https://github.com/geezoria/FLStudioMCP"
Repository = "https://github.com/geezoria/FLStudioMCP"
Issues = "https://github.com/geezoria/FLStudioMCP/issues"

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
